<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Tierre Phone — Standalone</title>
  <!-- Tailwind CSS & React CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <style>
    body { background-color: #070b14; color: white; font-family: -apple-system, BlinkMacSystemFont, sans-serif; user-select: none; }
    ::-webkit-scrollbar { display: none; }
  </style>
</head>
<body class="flex items-center justify-center min-h-screen m-0 overflow-hidden">

  <div id="root"></div>

  <script type="text/babel">
    const { useState, useEffect, useMemo } = React;

    const LOCKSCREEN_BG_URL = "https://pin.it/56bWM1wN4";
    const HOMESCREEN_BG_URL = "https://pin.it/4G1MFaLgH";
    const PASSCODE_CODE = "2917229";

    const GALLERY_IMAGES = [
      "https://images.unsplash.com/photo-1500530855697-b586d89ba3ee?auto=format&fit=crop&w=900&q=80",
      "https://images.unsplash.com/photo-1493246507139-91e8fad9978e?auto=format&fit=crop&w=900&q=80",
      "https://images.unsplash.com/photo-1469474968028-56623f02e42e?auto=format&fit=crop&w=900&q=80",
      "https://images.unsplash.com/photo-1470770841072-f978cf4d019e?auto=format&fit=crop&w=900&q=80",
      "https://images.unsplash.com/photo-1501785888041-af3ef285b470?auto=format&fit=crop&w=900&q=80",
      "https://images.unsplash.com/photo-1465146344425-f00d5f5c8f07?auto=format&fit=crop&w=900&q=80",
      "https://images.unsplash.com/photo-1504593811423-6dd665756598?auto=format&fit=crop&w=900&q=80",
      "https://images.unsplash.com/photo-1506744038136-46273834b3fb?auto=format&fit=crop&w=900&q=80",
      "https://images.unsplash.com/photo-1511497584788-876760111969?auto=format&fit=crop&w=900&q=80"
    ];

    const CHAT_MESSAGES = [
      { id: 1, sender: "pipev💋", gtext: "jangan lupa jemput El", time: "9:11 AM" },
      { id: 2, sender: "me", text: "ok, sayang. dedek kei lagi apa?", time: "9:13 AM" },
      { id: 3, sender: "pipev💋", text: "minum susu, papa~", time: "9:14 AM" },
      { id: 4, sender: "me", text: "ih mau jugaaa🥺", time: "9:14 AM" }
    ];

    const REMINDERS_LIST = [
      { id: 1, title: "Jemput El", due: "Today", priority: "High", checked: false },
      { id: 2, title: "Weekly Meeting!", due: "Tue", priority: "Medium", checked: false },
      { id: 3, title: "Ke rumah sakit", due: "Today", priority: "Low", checked: true },
      { id: 4, title: "Meet Papa", due: "Tomorrow", priority: "High", checked: false }
    ];

    function App() {
      const [isUnlocked, setIsUnlocked] = useState(false);
      const [showKeypad, setShowKeypad] = useState(false);
      const [passcodeInput, setPasscodeInput] = useState("");
      const [activeApp, setActiveApp] = useState("home");
      const [time, setTime] = useState("");
      const [selectedImg, setSelectedImg] = useState(null);
      const [isPlaying, setIsPlaying] = useState(true);
      const [chatMessages, setChatMessages] = useState(CHAT_MESSAGES);
      const [reminders, setReminders] = useState(REMINDERS_LIST);

      useEffect(() => {
        const update = () => {
          const now = new Date();
          setTime(now.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit', hour12: false }));
        };
        update();
        const interval = setInterval(update, 1000);
        return () => clearInterval(interval);
      }, []);

      const handleKeyPress = (num) => {
        if (num === "del") {
          setPasscodeInput(prev => prev.slice(0, -1));
          return;
        }
        const next = passcodeInput + num;
        if (next === PASSCODE_CODE) {
          setIsUnlocked(true);
          setShowKeypad(false);
          setPasscodeInput("");
        } else if (next.length >= PASSCODE_CODE.length) {
          alert("Wrong passcode!");
          setPasscodeInput("");
        } else {
          setPasscodeInput(next);
        }
      };

      const toggleReminder = (id) => {
        setReminders(prev => prev.map(item => item.id === id ? { ...item, checked: !item.checked } : item));
      };

      return (
        <div className="relative w-[390px] h-[844px] bg-black rounded-[50px] overflow-hidden border-[10px] border-[#1e1e24] shadow-2xl">
          {/* Status Bar */}
          <div className="absolute top-0 inset-x-0 h-11 z-50 flex justify-between items-center px-7 text-white text-xs font-semibold">
            <span>{time}</span>
            <div className="w-28 h-6 bg-black rounded-full absolute left-1/2 -translate-x-1/2 top-2 flex items-center justify-center">
              <span className="text-[9px] text-white/40">Dynamic Island</span>
            </div>
            <span>5G 🔋</span>
          </div>

          {/* 1. LOCK SCREEN */}
          {!isUnlocked && (
            <div className="absolute inset-0 z-40 bg-cover bg-center flex flex-col justify-between pt-16 pb-10 px-6"
                 style={{ backgroundImage: `url(${LOCKSCREEN_BG_URL})` }}>
              <div className="absolute inset-0 bg-black/30"></div>

              <div className="relative z-10 text-center mt-4">
                <p className="text-xs font-medium text-white/80 tracking-widest uppercase">Friday, Oct 23</p>
                <h1 className="text-7xl font-light tracking-tight mt-1">{time}</h1>
              </div>

              {!showKeypad ? (
                <div className="relative z-10 flex flex-col items-center gap-4">
                  <div className="w-full bg-white/10 backdrop-blur-md rounded-2xl p-3.5 border border-white/20 text-xs">
                    <p className="text-white/60">Now Playing</p>
                    <p className="font-semibold text-sm mt-0.5">You! - Lany</p>
                  </div>
                  <button 
                    onClick={() => setShowKeypad(true)}
                    className="text-xs tracking-widest text-white/90 bg-white/15 px-6 py-2.5 rounded-full backdrop-blur-md border border-white/20"
                  >
                    SWIPE UP
                  </button>
                </div>
              ) : (
                <div className="relative z-20 bg-slate-950/90 backdrop-blur-2xl absolute inset-0 p-6 flex flex-col items-center justify-center">
                  <p className="text-xs tracking-widest text-white/70 mb-4">ENTER PASSCODE</p>
                  <div className="flex gap-3 mb-8">
                    {Array.from({ length: PASSCODE_CODE.length }).map((_, i) => (
                      <div key={i} className={`w-3 h-3 rounded-full border border-white ${i < passcodeInput.length ? 'bg-white' : 'bg-transparent'}`}></div>
                    ))}
                  </div>
                  <div className="grid grid-cols-3 gap-3 w-64">
                    {["1","2","3","4","5","6","7","8","9","","0","del"].map((item, idx) => {
                      if (!item) return <div key={idx} />;
                      return (
                        <button
                          key={idx}
                          onClick={() => handleKeyPress(item)}
                          className="h-16 rounded-2xl bg-white/10 hover:bg-white/20 text-xl font-medium flex items-center justify-center active:scale-95 transition"
                        >
                          {item === "del" ? "⌫" : item}
                        </button>
                      );
                    })}
                  </div>
                  <button onClick={() => setShowKeypad(false)} className="mt-6 text-xs text-white/50">Cancel</button>
                </div>
              )}
            </div>
          )}

          {/* 2. HOME SCREEN */}
          {isUnlocked && activeApp === "home" && (
            <div className="absolute inset-0 bg-cover bg-center pt-16 px-6 flex flex-col justify-between pb-8"
                 style={{ backgroundImage: `url(${HOMESCREEN_BG_URL})` }}>
              <div className="absolute inset-0 bg-black/20"></div>

              <div className="relative z-10 grid grid-cols-4 gap-5 pt-4">
                {[
                  { id: "messages", label: "Messages", icon: "💬", bg: "from-emerald-400 to-green-500" },
                  { id: "gallery", label: "Photos", icon: "🖼️", bg: "from-pink-400 to-rose-500" },
                  { id: "reminders", label: "Reminders", icon: "☑️", bg: "from-amber-400 to-orange-500" },
                  { id: "music", label: "Music", icon: "🎵", bg: "from-violet-400 to-purple-500" },
                  { id: "settings", label: "Settings", icon: "⚙️", bg: "from-slate-400 to-slate-600" }
                ].map((app) => (
                  <button 
                    key={app.id} 
                    onClick={() => setActiveApp(app.id)}
                    className="flex flex-col items-center gap-1 group"
                  >
                    <div className={`w-14 h-14 rounded-2xl bg-gradient-to-br ${app.bg} flex items-center justify-center text-2xl shadow-lg group-hover:scale-105 transition`}>
                      {app.icon}
                    </div>
                    <span className="text-[10px] font-medium text-white drop-shadow">{app.label}</span>
                  </button>
                ))}
              </div>

              {/* Dock */}
              <div className="relative z-10 bg-white/20 backdrop-blur-xl rounded-3xl p-3 flex justify-around border border-white/20">
                <span className="text-2xl cursor-pointer">📞</span>
                <span className="text-2xl cursor-pointer" onClick={() => setActiveApp("messages")}>💬</span>
                <span className="text-2xl cursor-pointer" onClick={() => setActiveApp("gallery")}>🖼️</span>
                <span className="text-2xl cursor-pointer" onClick={() => setIsUnlocked(false)}>🔒</span>
              </div>
            </div>
          )}

          {/* 3. APP VIEWS */}
          {isUnlocked && activeApp !== "home" && (
            <div className="absolute inset-0 z-30 bg-slate-950 text-white pt-14 px-4 flex flex-col">
              <div className="flex justify-between items-center mb-4 pb-2 border-b border-white/10">
                <button onClick={() => setActiveApp("home")} className="text-sky-400 text-sm font-medium">‹ Home</button>
                <h2 className="text-sm font-bold uppercase tracking-widest">{activeApp}</h2>
                <div className="w-8"></div>
              </div>

              <div className="flex-1 overflow-y-auto pb-8">
                {activeApp === "gallery" && (
                  <div className="grid grid-cols-3 gap-2">
                    {GALLERY_IMAGES.map((img, i) => (
                      <img key={i} src={img} onClick={() => setSelectedImg(img)} className="w-full h-24 object-cover rounded-lg cursor-pointer hover:opacity-80 transition" />
                    ))}
                  </div>
                )}

                {activeApp === "messages" && (
                  <div className="space-y-3 text-xs">
                    {chatMessages.map(msg => (
                      <div key={msg.id} className={`p-3 rounded-2xl max-w-[80%] ${msg.sender === 'me' ? 'bg-sky-500 ml-auto text-right' : 'bg-white/10'}`}>
                        {msg.text}
                      </div>
                    ))}
                  </div>
                )}

                {activeApp === "reminders" && (
                  <div className="space-y-2">
                    {reminders.map(item => (
                      <div key={item.id} onClick={() => toggleReminder(item.id)} className="flex items-center gap-3 bg-white/5 p-3 rounded-xl cursor-pointer">
                        <div className={`w-4 h-4 rounded-full border ${item.checked ? 'bg-emerald-400 border-emerald-400' : 'border-white/40'}`}></div>
                        <span className={`text-xs ${item.checked ? 'line-through text-white/40' : ''}`}>{item.title}</span>
                      </div>
                    ))}
                  </div>
                )}

                {activeApp === "music" && (
                  <div className="flex flex-col items-center justify-center h-full text-center">
                    <div className="w-40 h-40 rounded-full bg-gradient-to-tr from-purple-500 to-pink-500 animate-pulse mb-6 flex items-center justify-center text-4xl">🎵</div>
                    <h3 className="text-xl font-bold">Midnight City</h3>
                    <p className="text-xs text-white/50 mt-1">M83</p>
                    <button onClick={() => setIsPlaying(!isPlaying)} className="mt-6 px-6 py-2 bg-white text-black font-semibold rounded-full text-xs">
                      {isPlaying ? "PAUSE" : "PLAY"}
                    </button>
                  </div>
                )}

                {activeApp === "settings" && (
                  <div className="p-2 text-xs space-y-4">
                    <div className="bg-white/5 p-3 rounded-xl">
                      <p className="text-white/60 mb-1">Passcode</p>
                      <p className="font-semibold">{PASSCODE_CODE}</p>
                    </div>
                  </div>
                )}
              </div>
            </div>
          )}

          {/* Modal Preview Foto */}
          {selectedImg && (
            <div className="fixed inset-0 z-50 bg-black/90 flex items-center justify-center p-4" onClick={() => setSelectedImg(null)}>
              <img src={selectedImg} className="max-w-full max-h-full rounded-xl" />
            </div>
          )}

          {/* Home Bar */}
          <div className="absolute bottom-1 inset-x-0 h-4 z-50 flex justify-center items-center cursor-pointer" onClick={() => setActiveApp("home")}>
            <div className="w-32 h-1 bg-white/50 rounded-full"></div>
          </div>
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
  </script>
</body>
</html>
